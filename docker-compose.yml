services:
  postgres:
    image: postgres:16-alpine
    container_name: sb-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/up:/docker-entrypoint-initdb.d
volumes:
  postgres_data: