name: Testes Java (Spring Boot 4 & Java 25)

on:
  push:
    branches:
      - dev/laurence
  pull_request:
    branches:
      - dev/laurence

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4


      - name: Subir Banco de Dados de Teste (Docker)
        run: docker compose up -d postgres-test


      - name: Aguardar o PostgreSQL iniciar
        run: |
          echo "Aguardando o PostgreSQL ficar pronto..."
          until docker exec sb-postgres-test pg_isready -U test -d postgres_test; do
            sleep 1
          done
          echo "PostgreSQL está pronto!"


      - name: Gerar chaves JWT temporárias (.pem)
        run: |
          # Altere 'src/main/resources/certs' para 'src/test/resources/certs' se preferir isolar nos recursos de teste
          TARGET_DIR="src/main/resources/certs"
          mkdir -p "$TARGET_DIR"
          
          # Gera a chave privada
          openssl genpkey -algorithm RSA -out "$TARGET_DIR/private.pem" -pkeyopt rsa_keygen_bits:2048
          # Extrai a chave pública a partir da privada
          openssl rsa -pubout -in "$TARGET_DIR/private.pem" -out "$TARGET_DIR/public.pem"
          
          echo "Chaves temporárias criadas em $TARGET_DIR"
        working-directory: santa-barbara-backend/bandasantabarbara

      - name: Configurar o JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'santa-barbara-backend/bandasantabarbara/pom.xml'


      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x ./mvnw
        working-directory: santa-barbara-backend/bandasantabarbara


      - name: Executar testes com Maven
        run: ./mvnw test
        working-directory: santa-barbara-backend/bandasantabarbara

      - name: Derrubar containers
        if: always()
        run: docker compose down
