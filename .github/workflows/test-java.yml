name: Testes Java

on:
  push:
    branches:
      - dev/laurence
  pull_request:
    branches:
      - dev/laurence

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir Banco de Dados de Teste (Docker)
        run: docker compose up -d postgres-test

      - name: Configurar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: 'santa-barbara-backend/bandasantabarbara/pom.xml'

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x ./mvnw
        working-directory: santa-barbara-backend/bandasantabarbara

      - name: Executar testes com Maven
        run: ./mvnw test
        working-directory: santa-barbara-backend/bandasantabarbara

      - name: Derrubar containers
        if: always()
        run: docker compose down
