
# Banco isolado de testes
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5434/postgres_test}
spring.datasource.username=${TEST_DATABASE_USERNAME:test}
spring.datasource.password=${TEST_DATABASE_PASSWORD:test}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.baseline-on-migrate=false

# Diagnóstico
spring.jpa.show-sql=false

# Armazenamento isolado
storage.local.root=./target/test-storage

# Convites de teste
frontend.invitation.url=http://localhost:3000/teste-convite/

# JWT
jwt.public.key=${JWT_PUBLIC_PEM_KEY_PATH:classpath:certs/public.pem}
jwt.private.key=${JWT_PRIVATE_PEM_KEY_PATH:classpath:certs/private.pem}

# SMTP de testes
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Secutiry Cookies
app.security.cookie.secure=false
app.security.cookie.same-site=Lax
app.security.cookie.path=/


# Public Routes

app.public.routes=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/setup,/auth/login,/convites/validar/*,/convites/aceitar