
# Flyway
spring.flyway.baseline-on-migrate=false

# Logs SQL
spring.jpa.show-sql=true

# Armazenamento isolado para testes
storage.local.root=./target/test-storage

# URL de conveite de teste
frontend.invitation.url=http://localhost:3000/teste-convite/


# JWT de desenvolvimento
jwt.public.key=classpath:certs/public.pem
jwt.private.key=classpath:certs/private.pem
jwt.expiration-seconds=7200

# Adicionando dB de teste

spring.datasource.url=jdbc:postgresql://localhost:5434/postgres_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# email
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test