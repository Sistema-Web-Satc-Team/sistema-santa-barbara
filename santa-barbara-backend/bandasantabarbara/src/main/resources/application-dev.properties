# Configuração Local Opcional
spring.config.import=optional:file:.env[.properties]

# PostgreSQL de desenvolvimento
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Logs SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.baseline-on-migrate=true

# Convites
frontend.invitation.url=http://localhost:3000/convidar-membro/

# Armazenamento
storage.local.root=./storage

# JWT de desenvolvimento
jwt.public.key=classpath:certs/public.pem
jwt.private.key=classpath:certs/private.pem
jwt.expiration-seconds=7200

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}