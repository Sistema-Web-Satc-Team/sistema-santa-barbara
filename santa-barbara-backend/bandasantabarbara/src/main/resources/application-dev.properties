
# Arquivo local opcional
spring.config.import=optional:file:./.env[.properties]

# Banco de desenvolvimento
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Diagnóstico SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.public.key=${JWT_PUBLIC_PEM_KEY_PATH:classpath:certs/public.pem}
jwt.private.key=${JWT_PRIVATE_PEM_KEY_PATH:classpath:certs/private.pem}

# SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:3025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Secutiry Cookies
app.security.cookie.secure=false
app.security.cookie.same-site=Lax
app.security.cookie.path=/

# Public Routes

app.public.routes=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/setup,/auth/login,/convites/validar/*,/convites/aceitar

# Swagger UI - CSRF
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN