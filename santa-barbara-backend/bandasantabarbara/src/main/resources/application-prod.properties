# Banco de produção
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Persistência
spring.jpa.show-sql=false

# JWT
jwt.public.key=${JWT_PUBLIC_PEM_KEY_PATH}
jwt.private.key=${JWT_PRIVATE_PEM_KEY_PATH}

# SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Armazenamento persistente
storage.local.root=${STORAGE_LOCAL_ROOT}

# URLs
frontend.invitation.url=${FRONTEND_INVITATION_URL}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Security Cookies
app.security.cookie.secure=true
app.security.cookie.same-site=None
app.security.cookie.path=/


# Public Routes

app.public.routes=/setup,/auth/login,/convites/validar/*,/convites/aceitar