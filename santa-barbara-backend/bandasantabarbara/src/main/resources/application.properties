spring.application.name=bandasantabarbara
spring.config.import=optional:file:./.env[.properties]

# API
server.servlet.context-path=/api/v1
spring.jackson.deserialization.fail-on-unknown-properties=true

# Perfis
spring.profiles.default=dev

# Persistência
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Uploads
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

# SMTP
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}

# Configurações de URLs
frontend.invitation.url=${FRONTEND_INVITATION_URL:http://localhost:3000/convidar-membro/}

# Armazenamento
storage.local.root=${STORAGE_LOCAL_ROOT:./storage}


logging.level.org.springframework.security=TRACE